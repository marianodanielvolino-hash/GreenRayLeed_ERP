#cloud-config
package_update: true
packages:
  - curl
  - git
  - fail2ban
  - docker.io
  - docker-compose-v2
  - python3-venv
  - ufw

runcmd:
  - [ bash, -lc, 'fallocate -l 4G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile || true' ]
  - [ bash, -lc, 'grep -q /swapfile /etc/fstab || echo "/swapfile none swap sw 0 0" >> /etc/fstab' ]
  - [ bash, -lc, 'ufw default deny incoming && ufw default allow outgoing' ]
  - [ bash, -lc, 'ufw allow from __SSH_ALLOWED_CIDR__ to any port 22 proto tcp' ]
  - [ ufw, allow, 80/tcp ]
  - [ ufw, allow, 443/tcp ]
  - [ ufw, --force, enable ]
  - [ systemctl, enable, --now, docker ]
  - [ systemctl, enable, --now, fail2ban ]
  - [ usermod, -aG, docker, ubuntu ]
  - [ bash, -lc, 'mkdir -p /opt/greenray && chown ubuntu:ubuntu /opt/greenray' ]
  - [ bash, -lc, 'sudo -u ubuntu git clone https://github.com/marianodanielvolino-hash/GreenRayLeed_ERP.git /opt/greenray/GreenRayLeed_ERP' ]
  - [ bash, -lc, 'chmod 0750 /opt/greenray/GreenRayLeed_ERP/scripts/backup_oci.py' ]
  - [ bash, -lc, 'echo "15 6 * * * root python3 /opt/greenray/GreenRayLeed_ERP/scripts/backup_oci.py >> /var/log/greenray-backup.log 2>&1" > /etc/cron.d/greenray-backup' ]
  - [ bash, -lc, 'touch /var/lib/greenray-cloud-init-complete' ]
