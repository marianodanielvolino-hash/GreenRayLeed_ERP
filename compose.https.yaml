services:
  frontend:
    labels:
      - traefik.enable=true
      - traefik.http.routers.greenray.rule=Host(`${PUBLIC_HOSTNAME}`)
      - traefik.http.routers.greenray.entrypoints=websecure
      - traefik.http.routers.greenray.tls.certresolver=letsencrypt
      - traefik.http.services.greenray.loadbalancer.server.port=8080
  traefik:
    image: traefik:v3.7.1
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/certs/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/certs
volumes:
  traefik-certs:
