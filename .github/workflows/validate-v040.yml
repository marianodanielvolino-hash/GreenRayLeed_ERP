name: validate-v040

on:
  pull_request:
  workflow_dispatch:

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Reconstruct fch_ops
        run: bash scripts/bootstrap-source.sh
      - name: Validate GreenRay ERP
        run: bash scripts/validate.sh
