name: validate

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JSON and Python syntax
        run: bash ./scripts/validate.sh
